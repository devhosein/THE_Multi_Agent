name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Python tests (engine, server, tools, UI assets)
        run: python -m unittest discover -s tests -t . -v
      - name: UI reducer tests
        run: node --test tests/ui_state.test.mjs

  e2e:
    name: Browser end-to-end (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run the e2e checks
        run: python tests/e2e_ui.py
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-screenshots
          path: e2e-shots/
          if-no-files-found: ignore
